server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mynoano}
spring.datasource.username=${DB_USER:mynoano}
spring.datasource.password=${DB_PASSWORD:mynoano}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Auth. Set JWT_SECRET (base64, 32+ bytes) in production.
jwt.secret=${JWT_SECRET:bXlub2Fuby1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtMzJieXRlcyEh}
jwt.expiration-ms=604800000

app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
app.upload-dir=${UPLOAD_DIR:uploads}

# Nearby discovery. People are matched inside this radius; distance is never returned.
app.discovery.radius-meters=60
app.discovery.location-ttl-minutes=10

# DEV ONLY: fixed OTP so you can sign up without an SMS/email provider. Leave empty in production.
app.otp.dev-fixed-code=${OTP_DEV_CODE:123456}
